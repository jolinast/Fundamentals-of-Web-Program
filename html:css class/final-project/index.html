<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mount Vernon Veterinary Clinic | IA</title>
    <link rel="icon" href="images/short-logo-MVVC.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/final-project.css" />
  </head>

  <body>
    <header>
      <input type="checkbox" id="menu-checkbox" />

      <div id="header-top">
        <div id="logo">
          <a href="index.html">
            <img
              src="images/short-logo-MVVC.png"
              alt="Mount Vernon Veterinary Clinic Logo"
            />
          </a>
          <span id="clinic-name">Mount Vernon<br />Veterinary Clinic</span>
        </div>

        <div id="header-contact">
          <p>E-Mail: mvvet@gmail.com</p>
          <p>Phone: +1 (319) 895-2300</p>
        </div>
      </div>

      <nav id="contact-mobile-nav">
        <a href="contact.html" class="btn header-btn">Contact us</a>
        <!-- Das Label ist das Hamburger-Icon und schaltet die Checkbox um -->
        <label for="menu-checkbox" id="mobile-nav" aria-label="Open menu">
          <i class="fa-solid fa-bars fa-2xl"></i>
        </label>
      </nav>

      <nav id="main-menu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html">About us</a></li>
          <li><a href="index.html">Services</a></li>
          <li><a href="index.html">Our clinic</a></li>
          <li><a href="index.html">Our shop</a></li>
          <li><a href="contact.html">Contact us</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Mount Vernon Veterinary Clinic</h1>

      <div id="mt-vernon-building">
        <img
          src="images/mt-vernon-building.jpeg"
          alt="Mount Vernon Veterinary Clinic building"
        />
      </div>
    </main>
  </body>
</html>
